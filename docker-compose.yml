services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Gukesh12garry@
      MYSQL_DATABASE: iris_systems_rec_task_development
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rails_network

  app1:
    build: .
    container_name: rails-app1
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: Gukesh12garry@
      DATABASE_NAME: iris_systems_rec_task_development
    volumes:
      - rails_logs:/app/log
    networks:
      - rails_network
    command: bash -lc "bundle _2.6.6_ exec rails s -b 0.0.0.0"

  app2:
    build: .
    container_name: rails-app2
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: Gukesh12garry@
      DATABASE_NAME: iris_systems_rec_task_development
    volumes:
      - rails_logs:/app/log
    networks:
      - rails_network
    command: bash -lc "bundle _2.6.6_ exec rails s -b 0.0.0.0"

  app3:
    build: .
    container_name: rails-app3
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: Gukesh12garry@
      DATABASE_NAME: iris_systems_rec_task_development
    volumes:
      - rails_logs:/app/log
    networks:
      - rails_network
    command: bash -lc "bundle _2.6.6_ exec rails s -b 0.0.0.0"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_config:/etc/nginx
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - rails_network

volumes:
  db_data:
  nginx_config:
  rails_logs:

networks:
  rails_network:
